[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instrkit"
version = "1.0.0"
description = "Agent Instructions Kit: a template and checker for AGENTS.md™ files (free edition)."
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
instrkit = "instrkit.cli:main"

[tool.setuptools]
packages = ["instrkit"]
